name: plataforma-ingresso

services:
  php:
    image: plataforma-ingresso-php
    build:
      context: .
      args:
        APP_VERSAO: dev
    volumes:
      - ./:/var/www/html

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
